name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src scripts tests

      - name: Dependency audit
        run: pip-audit --local

      - name: Run tests
        run: pytest

  model-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and audit optional runtime adapters
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[models,generation]" -r requirements-dev.txt
          pip-audit --local
      - name: Validate pinned CPU model
        env:
          RAG_TEST_MODELS: "1"
        run: pytest tests/test_embeddings.py

  # Preserve the exact required branch-protection check name across the matrix.
  test-and-audit:
    needs: [core-tests, model-integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all checks to pass
        env:
          CORE_RESULT: ${{ needs.core-tests.result }}
          MODEL_RESULT: ${{ needs.model-integration.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$MODEL_RESULT" = success
