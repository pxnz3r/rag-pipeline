name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src scripts tests

      - name: Dependency audit
        run: pip-audit --local

      - name: Run tests
        run: pytest

      - name: Validate notebook
        run: python scripts/validate_notebook.py Python3finale.ipynb

      - name: Pattern audit
        run: python scripts/audit_notebook_patterns.py Python3finale.ipynb

      - name: Offline smoke
        run: python scripts/smoke_e2e.py

      - name: CLI smoke
        run: python -m rag_pipeline.cli smoke

  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install local store adapter
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt "chromadb>=1.5.9,<2"
      - name: Test persistent storage with synthetic embeddings
        run: pytest tests/test_chroma_integration.py
