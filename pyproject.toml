[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.6.0"
description = "Transactional, evidence-first financial and legal retrieval"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "pxnz3r" }
]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "llm",
  "python",
  "notebook",
  "vector-search",
  "sqlite",
  "bm25",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["pypdf>=6.19.0"]

[project.optional-dependencies]
models = ["numpy>=1.24", "onnxruntime>=1.23.1,<2", "tokenizers>=0.22.1,<1", "huggingface-hub>=1.0,<2"]
generation = ["groq>=0.31.0,<2"]

[project.scripts]
rag-pipeline = "rag_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/pxnz3r/rag-pipeline"
Repository = "https://github.com/pxnz3r/rag-pipeline"
Issues = "https://github.com/pxnz3r/rag-pipeline/issues"
Documentation = "https://github.com/pxnz3r/rag-pipeline/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
