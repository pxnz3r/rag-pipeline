[build-system]
requires = ["setuptools>=83.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.2.0"
description = "Notebook-orchestrated, package-first retrieval-augmented generation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "pxnz3r" }
]
keywords = [
  "rag",
  "retrieval-augmented-generation",
  "llm",
  "python",
  "notebook",
  "vector-search",
  "chroma",
  "bm25",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "numpy>=1.24",
  "pypdf>=6.19.0",
  "rank-bm25>=0.2.2",
  "requests>=2.34.2",
  "filelock>=3.20.3",
]

[project.optional-dependencies]
notebook = [
  "groq>=0.31.0,<2",
  "chromadb>=1.0.20,<2",
  "sentence-transformers>=5.1.0,<6",
  "ragas>=0.4.3,<0.5",
  "lightrag-hku>=1.5.7,<2",
  "langchain-groq>=1.1.3,<2",
  "langchain-huggingface>=1.0.0,<2",
  # Ragas' transitive dependency needs the patched request/header handling.
  "langchain-openai>=1.1.14,<2",
  "nest_asyncio>=1.6.0",
  "tenacity>=9.0.0",
  "tqdm>=4.67.1",
  "datasets>=5.0.1,<6",
  "torch>=2.8.0",
]

[project.scripts]
rag-pipeline = "rag_pipeline.cli:main"

[project.urls]
Homepage = "https://github.com/pxnz3r/rag-pipeline"
Repository = "https://github.com/pxnz3r/rag-pipeline"
Issues = "https://github.com/pxnz3r/rag-pipeline/issues"
Documentation = "https://github.com/pxnz3r/rag-pipeline/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
